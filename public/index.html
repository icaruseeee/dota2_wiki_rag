<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>刀塔百科 · 问答</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d2129;
    --line: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --gold: #c8a45c;
    --red: #d9534f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 860px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .3px;
  }
  header h1 span { color: var(--gold); }
  header .meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg { display: flex; flex-direction: column; gap: 8px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: #232a36;
    border-color: #333c4d;
  }
  .answer { white-space: normal; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 6px 0 10px; padding-left: 22px; }
  .answer li { margin: 3px 0; }
  .answer strong { color: #f2e6cd; font-weight: 600; }
  .answer code {
    background: #0b0d11;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 13px;
  }
  .cite {
    color: var(--gold);
    font-size: 11px;
    vertical-align: super;
    margin-left: 1px;
  }
  .status {
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .sources {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 2px;
  }
  .src {
    display: flex;
    gap: 10px;
    align-items: baseline;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12.5px;
  }
  .src .idx {
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    min-width: 20px;
  }
  .src a { color: var(--text); text-decoration: none; }
  .src a:hover { color: var(--gold); text-decoration: underline; }
  .src .type {
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 5px;
    font-size: 11px;
  }
  .src .score { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { color: var(--red); font-size: 13.5px; }
  .empty {
    color: var(--muted);
    text-align: center;
    margin-top: 8vh;
    font-size: 14px;
  }
  .empty .examples { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .empty button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    cursor: pointer;
    transition: .15s;
  }
  .empty button:hover { border-color: var(--gold); color: var(--gold); }
  form#composer {
    padding: 12px 20px 18px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
    background: var(--bg);
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 10px 13px;
    font: inherit;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
  }
  textarea:focus { border-color: #3d4657; }
  button#send {
    background: var(--gold);
    color: #1a1409;
    border: 0;
    border-radius: 10px;
    padding: 0 18px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button#send:disabled { opacity: .45; cursor: default; }
  .toggle {
    display: flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--muted); cursor: pointer;
    white-space: nowrap; user-select: none;
  }
  .toggle input { accent-color: var(--gold); cursor: pointer; }
  .hint { color: var(--muted); font-size: 11.5px; text-align: center; padding-bottom: 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>刀塔百科 · <span>问答</span></h1>
    <div class="meta" id="meta">128 英雄 · 852 技能 · 157 机制文</div>
  </header>

  <main id="log">
    <div class="empty" id="empty">
      <div>基于 wiki.dota2.com.cn 的本地检索问答</div>
      <div class="examples">
        <button>弱驱散和强驱散有什么区别？</button>
        <button>影魔的毁灭阴影连中伤害怎么计算？</button>
        <button>什么情况下技能伤害不会触发技能增强？</button>
      </div>
    </div>
  </main>

  <form id="composer">
    <textarea id="q" rows="1" placeholder="问点什么，例如：林肯法球能抵挡哪些技能？" autofocus></textarea>
    <label class="toggle" title="精排更准，但这台机器上要 20 秒以上">
      <input type="checkbox" id="rerank" /> 精排
    </label>
    <button id="send" type="submit">发送</button>
  </form>
  <div class="hint">Enter 发送 · Shift + Enter 换行 · 答案仅依据检索到的 wiki 内容</div>
</div>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const form = document.getElementById('composer');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');
const rerankBox = document.getElementById('rerank');

let busy = false;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 极简 markdown：段落 / 列表 / 加粗 / 行内代码 / 引用编号 */
function renderMarkdown(text) {
  const lines = escapeHtml(text).split('\n');
  const out = [];
  let list = null;

  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');

  const flushList = () => {
    if (list) { out.push(`<${list.tag}>${list.items.join('')}</${list.tag}>`); list = null; }
  };

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { flushList(); continue; }
    const bullet = line.match(/^[-*]\s+(.*)$/);
    const numbered = line.match(/^\d+[.)]\s+(.*)$/);
    if (bullet || numbered) {
      const tag = bullet ? 'ul' : 'ol';
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push(`<li>${inline((bullet || numbered)[1])}</li>`);
      continue;
    }
    flushList();
    out.push(`<p>${inline(line)}</p>`);
  }
  flushList();
  return out.join('');
}

function addUser(text) {
  const wrap = el('div', 'msg user');
  wrap.appendChild(el('div', 'bubble', text));
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function addAssistant() {
  const wrap = el('div', 'msg');
  const status = el('div', 'status');
  status.appendChild(el('span', 'dot'));
  status.appendChild(el('span', '', '检索中…'));
  const answer = el('div', 'bubble answer');
  answer.style.display = 'none';
  const sources = el('div', 'sources');
  wrap.append(status, answer, sources);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return { wrap, status, answer, sources };
}

function renderSources(container, list) {
  container.innerHTML = '';
  for (const s of list) {
    const row = el('div', 'src');
    row.appendChild(el('span', 'idx', `[${s.index}]`));
    const link = el('a', '', s.title + (s.heading ? ` · ${s.heading}` : ''));
    link.href = s.url || '#';
    link.target = '_blank';
    link.rel = 'noopener';
    row.appendChild(link);
    row.appendChild(el('span', 'type', s.doc_type));
    row.appendChild(el('span', 'score', s.score.toFixed(3)));
    container.appendChild(row);
  }
}

async function ask(question) {
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  empty?.remove();
  addUser(question);
  const ui = addAssistant();

  let buffer = '';
  const apply = () => { ui.answer.innerHTML = renderMarkdown(buffer); };

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, rerank: rerankBox.checked }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let raw = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      raw += decoder.decode(value, { stream: true });
      const parts = raw.split('\n\n');
      raw = parts.pop() ?? '';
      for (const part of parts) {
        const line = part.split('\n').find((l) => l.startsWith('data:'));
        if (!line) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (evt.type === 'status') {
          ui.status.lastChild.textContent = evt.text;
        } else if (evt.type === 'sources') {
          ui.status.lastChild.textContent = `已检索 ${evt.sources.length} 块（${evt.retrieval_seconds}s）`;
          renderSources(ui.sources, evt.sources);
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === 'delta') {
          if (ui.answer.style.display === 'none') {
            ui.answer.style.display = '';
            ui.status.remove();
          }
          buffer += evt.text;
          apply();
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === 'done') {
          ui.answer.innerHTML = renderMarkdown(buffer) || '<p class="err">（空回答）</p>';
          const meta = el('div', 'status', `完成 · ${evt.elapsed_seconds}s`);
          ui.wrap.appendChild(meta);
        } else if (evt.type === 'error') {
          ui.status.remove();
          ui.wrap.appendChild(el('div', 'err', evt.message));
        }
      }
    }
  } catch (err) {
    ui.wrap.appendChild(el('div', 'err', err.message));
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  input.style.height = 'auto';
  ask(q);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

document.querySelectorAll('.examples button').forEach((b) => {
  b.addEventListener('click', () => ask(b.textContent));
});
</script>
</body>
</html>
